<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Our Telegram Community</title>

    <!-- =========================
         META PIXEL CODE
    ========================== -->
    <script>
    !function(f,b,e,v,n,t,s)
    {
        if(f.fbq)return;
        n=f.fbq=function(){
            n.callMethod ?
            n.callMethod.apply(n,arguments) :
            n.queue.push(arguments)
        };

        if(!f._fbq)f._fbq=n;
        n.push=n;
        n.loaded=!0;
        n.version='2.0';
        n.queue=[];

        t=b.createElement(e);
        t.async=!0;
        t.src=v;

        s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)
    }(
        window,
        document,
        'script',
        'https://connect.facebook.net/en_US/fbevents.js'
    );

    /* Your Meta Pixel ID */
    fbq('init', '127885405401133498');

    /* Page View Event */
    fbq('track', 'PageView');
    </script>

    <!-- Meta Pixel NoScript -->
    <noscript>
        <img
            height="1"
            width="1"
            style="display:none"
            src="https://www.facebook.com/tr?id=27885405401133498&ev=PageView&noscript=1"
        />
    </noscript>

    <!-- =========================
         PAGE CSS
    ========================== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 32px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 4px;
            border: 2px solid #229ED9;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .badge {
            background-color: #e8f5fe;
            color: #1d9bf0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 8px 18px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: inline-block;
        }

        .title {
            color: #0f1419;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .description {
            color: #536471;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        .btn-telegram {
            background-color: #20a0e1;
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(32, 160, 225, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-telegram:hover {
            background-color: #1b8dca;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(32, 160, 225, 0.4);
        }

        .btn-telegram:active {
            transform: translateY(0);
        }

        .footer-text {
            color: #8b98a5;
            font-size: 14px;
            margin-top: 24px;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Profile Image -->
        <div class="profile-container">
            <img
                src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400"
                alt="Profile"
                class="profile-img"
            >
        </div>

        <!-- Badge -->
        <div class="badge">
            TELEGRAM COMMUNITY
        </div>

        <!-- Title -->
        <h1 class="title">
            Join Our Telegram
        </h1>

        <!-- Description -->
        <p class="description">
            Join our Telegram channel/group and stay connected.
            Tap the button below to join now.
        </p>

        <!-- Telegram Button -->
        <a
            href="https://t.me/+LaCfp1FV5Aw4NzQ0"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-telegram"
            onclick="trackTelegramContact()"
        >
            🚀 Join Telegram
        </a>

        <!-- Footer -->
        <p class="footer-text">
            Free to join • Click the button to continue
        </p>

    </div>


    <!-- =========================
         TELEGRAM BUTTON CONTACT EVENT
    ========================== -->
    <script>
        function trackTelegramContact() {

            /* Meta Contact Event */
            fbq('track', 'Contact');

        }
    </script>

</body>
</html>
